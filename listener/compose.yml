services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamforge_listener
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d streamforge_listener"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10-alpine
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/streamforge_listener
      FLYWAY_USER: admin
      FLYWAY_PASSWORD: admin
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./migrations:/flyway/sql:ro
    command: -url=jdbc:postgresql://db:5432/streamforge_listener -user=admin -password=admin migrate
    restart: "no"

volumes:
  db_data:
